<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Watchlist</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#141E30,#243B55);
    padding:40px;
}

.container{
    width:100%;
    max-width:1000px;
    background:white;
    border-radius:18px;
    padding:35px;
    box-shadow:0 20px 40px rgba(0,0,0,.3);
}

h1{
    text-align:center;
    margin-bottom:30px;
    color:#222;
}

.form{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    margin-bottom:25px;
}

input,
select{
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

input:focus,
select:focus{
    border-color:#4f46e5;
}

.buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:30px;
}

button{
    border:none;
    padding:12px 18px;
    border-radius:8px;
    color:white;
    cursor:pointer;
    transition:.25s;
    font-size:15px;
}

button:hover{
    transform:translateY(-2px);
}

#addBtn{background:#000000;}
#findBtn{background:#3b82f6;}
#watchedBtn{background:#8b5cf6;}
#unwatchedBtn{background:#f97316;}
#showAllBtn{background:#334155;}

table{
    width:100%;
    border-collapse:collapse;
    overflow:hidden;
    border-radius:10px;
}

th{
    background:#1e293b;
    color:white;
}

th,td{
    padding:14px;
    text-align:center;
    border-bottom:1px solid #eee;
}

tr:hover{
    background:#f5f5f5;
}

@media(max-width:700px){

.buttons{
    flex-direction:column;
}

button{
    width:100%;
}

}

</style>

</head>
<body>

<div class="container">

<h1>🎬 Movie Watchlist</h1>

<div class="form">

<input
type="text"
id="movieTitle"
placeholder="Movie Title">

<input
type="text"
id="movieGenre"
placeholder="Genre">

<input
type="number"
id="movieRating"
placeholder="Rating (1-10)"
min="1"
max="10">

<select id="movieStatus">
<option value="Watched">Watched</option>
<option value="Unwatched">Unwatched</option>
</select>

</div>

<div class="buttons">

<button id="addBtn"> Add Movie</button>

<button id="findBtn">🔍 Find Movie</button>

<button id="watchedBtn">✅ Watched</button>

<button id="unwatchedBtn">🎬 Unwatched</button>

<button id="showAllBtn">📋 Show All</button>

</div>

<table>

<thead>

<tr>
<th>ID</th>
<th>Title</th>
<th>Genre</th>
<th>Rating</th>
<th>Status</th>
</tr>

</thead>

<tbody id="movieTable">

</tbody>

</table>

</div>

<script src="Movie_watchlist.js"></script>

</body>
</html>
