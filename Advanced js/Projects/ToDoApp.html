<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#09090b;
color:white;
display:flex;
justify-content:center;
padding:50px 20px;
}

.container{
width:100%;
max-width:900px;
}

header{
margin-bottom:35px;
}

header h1{
font-size:38px;
font-weight:700;
letter-spacing:-1px;
}

header p{
margin-top:8px;
color:#8b8b95;
}

.card{
background:#141418;
border:1px solid #24242a;
padding:24px;
border-radius:18px;
}

.form{
display:grid;
grid-template-columns:2fr 1fr 1fr auto;
gap:15px;
}

input,
select{
background:#1d1d22;
border:1px solid #2c2c33;
color:white;
padding:14px;
border-radius:12px;
outline:none;
font-size:15px;
transition:.3s;
}

input:focus,
select:focus{
border-color:#5b7cff;
}

button{
background:#4f6cff;
border:none;
padding:14px 26px;
border-radius:12px;
color:white;
font-weight:600;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#6481ff;
}

.toolbar{
display:flex;
justify-content:space-between;
margin:30px 0;
gap:15px;
flex-wrap:wrap;
}

.search{
flex:1;
}

.filters{
display:flex;
gap:10px;
}

.filter{
background:#18181d;
border:1px solid #2c2c33;
padding:10px 18px;
border-radius:10px;
color:#bbb;
cursor:pointer;
}

.filter.active{
background:#4f6cff;
border:none;
color:white;
}

.tasks{
display:flex;
flex-direction:column;
gap:18px;
}

.task{
background:#141418;
border:1px solid #24242a;
padding:20px;
border-radius:18px;
display:flex;
justify-content:space-between;
align-items:center;
transition:.3s;
}

.task:hover{
border-color:#4f6cff;
}

.left{
display:flex;
gap:18px;
align-items:flex-start;
}

.checkbox{
width:22px;
height:22px;
border-radius:6px;
border:2px solid #4f6cff;
margin-top:2px;
cursor:pointer;
}

.task h3{
font-size:18px;
margin-bottom:6px;
}

.meta{
display:flex;
gap:12px;
flex-wrap:wrap;
}

.tag{
padding:6px 12px;
background:#1e1e24;
border-radius:50px;
font-size:13px;
color:#aaa;
}

.high{
color:#ff6969;
}

.medium{
color:#ffbf57;
}

.low{
color:#5fe58f;
}

.actions{
display:flex;
gap:10px;
}

.secondary{
background:#1f1f25;
}

.secondary:hover{
background:#2a2a31;
}

.delete{
background:#2d1d21;
}

.delete:hover{
background:#47262d;
}

.empty{
margin-top:50px;
text-align:center;
padding:50px;
background:#141418;
border-radius:18px;
border:1px dashed #2f2f35;
display:none;
}

.empty h2{
font-weight:600;
margin-bottom:10px;
}

.empty p{
color:#7c7c84;
}

footer{
margin-top:35px;
display:flex;
justify-content:space-between;
flex-wrap:wrap;
color:#8a8a92;
font-size:15px;
}

@media(max-width:760px){

.form{
grid-template-columns:1fr;
}

.toolbar{
flex-direction:column;
}

.task{
flex-direction:column;
align-items:flex-start;
gap:18px;
}

.actions{
width:100%;
}

.actions button{
flex:1;
}

}

</style>
</head>
<body>

<div class="container">

<header>
<h1>TaskFlow</h1>
<p>Stay organized. Finish what matters.</p>
</header>

<div class="card">

<div class="form">

<input
type="text"
placeholder="What needs to be done?"
id="taskInput">

<select id="priority">
<option>Low</option>
<option selected>Medium</option>
<option>High</option>
</select>

<input
type="date"
id="date">

<button id="addBtn">
Add Task
</button>

</div>

</div>

<div class="toolbar">

<input
class="search"
type="text"
placeholder="Search task..."
id="search">

<div class="filters">

<div class="filter active" id="allFilter">
All
</div>

<div class="filter" id="activeFilter">
Active
</div>

<div class="filter" id="completedFilter">
Completed
</div>

</div>

</div>

<!-- Tasks will be generated by JavaScript -->
<div class="tasks" id="taskContainer"></div>

<!-- Empty state -->
<div class="empty" id="emptyState">

<h2>No Tasks Yet</h2>

<p>Add your first task to get started.</p>

</div>

<footer>

<div>
Total Tasks:
<strong id="totalTasks">0</strong>
</div>

<div>
Completed:
<strong id="completedTasks">0</strong>
</div>

<div>
Pending:
<strong id="pendingTasks">0</strong>
</div>

</footer>

</div>

<script src="ToDoApp.js"></script>

</body>
</html>
